# <=== Defaults ===>
# Assumed values for all variable attrs unless overwritten
default_attrs: &default
  DEPEND_0: epoch
  DISPLAY_TYPE: time_series
  FILLVAL: -9223372036854775808
  FORMAT: I12
  SCALETYP: linear
  UNITS: ' '
  VALIDMAX: 9223372036854775807
  VALIDMIN: 0
  VAR_TYPE: data

hk_support_attrs: &hk_support_default
  <<: *default
  DISPLAY_TYPE: no_plot
  VAR_TYPE: ignore_data

hk_metadata_attrs: &metadata_default
  FORMAT: A2
  VAR_TYPE: metadata

default_uint32_attrs: &default_uint32
  <<: *default
  FILLVAL: 4294967295
  FORMAT: I10
  VALIDMAX: 4294967295
  VALIDMIN: 0
  dtype: uint32

# Science (rate) defaults.
# NOTE ON UNITS: these variables are raw counts divided by a dimensionless
# livetime fraction (dead-time correction) - see calculate_rates() in
# hit_l1b.py. No division by an actual accumulation time occurs in this
# processing step, so UNITS is set to "counts" (matching the L1A raw counts
# unit) rather than a per-second rate. Confirm with Andriy whether this
# should instead be counts/s once the accumulation interval is folded in.
default_rate_attrs: &default_rate
  DEPEND_0: epoch
  DISPLAY_TYPE: time_series
  FILLVAL: -1.00E+31
  FORMAT: F14.3
  SCALETYP: linear
  UNITS: counts
  VALIDMAX: 10000000000.0
  VALIDMIN: 0
  VAR_TYPE: data

default_rate_uncertainty_attrs: &default_rate_uncertainty
  <<: *default_rate
  VAR_TYPE: support_data

default_energy_attrs: &default_energy
  DISPLAY_TYPE: no_plot
  FILLVAL: -1.00E+31
  FORMAT: F6.1
  LABLAXIS: Energy
  SCALETYP: log
  UNITS: MeV/nuc
  VALIDMAX: 1000
  VALIDMIN: 0
  VAR_TYPE: support_data

default_energy_delta_attrs: &default_energy_delta
  <<: *default_energy
  LABLAXIS: Energy delta

# <=== Coordinates ===>
adc_channels:   # adc_channels is a dependency for leak_i data variable
  CATDESC: ADC Channel
  DISPLAY_TYPE: no_plot
  FIELDNAM: ADC Channel
  FILLVAL: -9223372036854775808
  FORMAT: I2
  LABLAXIS: Channel
  SCALETYP: linear
  UNITS: ' '
  VALIDMAX: 63
  VALIDMIN: 0
  VAR_TYPE: metadata

# <=== Label Attributes ===>
# LABL_PTR_i expects VAR_TYPE of metadata with char data type

adc_channels_label:
  CATDESC: Analog Digital Converter Channels
  FIELDNAM: ADC Channels

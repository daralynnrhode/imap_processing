  CATDESC: Argon count rate (livetime corrected)
  DELTA_MINUS_VAR: ar_stat_uncert_minus
  DELTA_PLUS_VAR: ar_stat_uncert_plus
  DEPEND_1: ar_energy_mean
  FIELDNAM: Argon rate
  LABLAXIS: ar

ar_stat_uncert_minus:
  <<: *default_rate_uncertainty
  CATDESC: Argon count rate statistical uncertainty minus (minus delta)
  DEPEND_1: ar_energy_mean
  FIELDNAM: Argon rate stat uncert minus
  LABLAXIS: ar unc minus

ar_stat_uncert_plus:
  <<: *default_rate_uncertainty
  CATDESC: Argon count rate statistical uncertainty plus (plus delta)
  DEPEND_1: ar_energy_mean
  FIELDNAM: Argon rate stat uncert plus
  LABLAXIS: ar unc plus

ar_energy_mean:
  <<: *default_energy
  CATDESC: Argon geometric mean energy per nucleon
  DELTA_MINUS_VAR: ar_energy_delta_minus
  DELTA_PLUS_VAR: ar_energy_delta_plus
  FIELDNAM: Argon energy mean
  LABLAXIS: ar energy

ar_energy_delta_minus:
  <<: *default_energy_delta
  CATDESC: Argon energy delta minus
  DEPEND_1: ar_energy_mean
  FIELDNAM: Argon energy delta minus
  LABLAXIS: ar energy delta minus

ar_energy_delta_plus:
  <<: *default_energy_delta
  CATDESC: Argon energy delta plus
  DEPEND_1: ar_energy_mean
  FIELDNAM: Argon energy delta plus
  LABLAXIS: ar energy delta plus

